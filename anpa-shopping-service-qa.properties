# Informacion descriptiva del archivo
meta.application=anpa-shopping-service
meta.environment=qa
meta.version=1.0.0

# Configuracion de la base de datos.
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/anpa_shopping_service_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql:true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Actuator (Inicio)
# Se exponen todos los endpoints disponibles (/actuator/health, /actuator/metrics, /actuator/beans, etc.).
# Sin esta propiedad, solo los endpoints health y info estan expuestos por defecto.
management.endpoints.web.exposure.include=*

# Discovery (Inicio)
# Puerto donde se levantara el servidor.
# El valor "0" permite que el sistema operativo asigne un puerto aleatorio.
server.port=0

# Configuracion para la instancia del cliente Eureka (Service Discovery).
# Se utiliza para registrar la aplicacion en el servidor Eureka.
# El "instance-id" se genera dinamicamente combinando el nombre de la aplicacion y un valor aleatorio.
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Resilience4J - Configuracion del Circuit Breaker customerCircuitBreaker
resilience4j.circuitbreaker.instances.customerCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.customerCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customerCircuitBreaker.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.instances.customerCircuitBreaker.slidingWindowSize=100
resilience4j.circuitbreaker.instances.customerCircuitBreaker.permittedNumberOfCallsInHalfOpenState=10
resilience4j.circuitbreaker.instances.customerCircuitBreaker.minimumNumberOfCalls=5

# Resilience4J - Configuracion del Circuit Breaker productCircuitBreaker
resilience4j.circuitbreaker.instances.productCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productCircuitBreaker.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.instances.productCircuitBreaker.slidingWindowSize=100
resilience4j.circuitbreaker.instances.productCircuitBreaker.permittedNumberOfCallsInHalfOpenState=10
resilience4j.circuitbreaker.instances.productCircuitBreaker.minimumNumberOfCalls=5